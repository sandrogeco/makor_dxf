<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XY Chart - DXF CSV Viewer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #131824;
            --bg-tertiary: #1a2030;
            --accent-blue: #00d4ff;
            --accent-cyan: #00ffaa;
            --text-primary: #e8edf4;
            --text-secondary: #8a94a8;
            --border-color: #2a3447;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        .widget-container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chart-area {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        #chartCanvas {
            width: 100%;
            height: 500px;
            cursor: crosshair;
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.03) 0%, transparent 100%);
        }

        .controls-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .control-group {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .control-group:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .control-group h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .control-btn {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 170, 0.1));
            border: 1px solid var(--accent-blue);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Barlow', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .control-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 170, 0.2));
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
        }

        .control-btn span {
            position: relative;
            z-index: 1;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .slider-container {
            margin-top: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .slider-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.4);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.6);
        }

        .info-panel {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .info-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 500;
            color: var(--accent-cyan);
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-upload-label {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 170, 0.1));
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Barlow', sans-serif;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 170, 0.2));
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
        }

        .file-name-display {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="header">
            <h1>XY Chart - DXF Viewer</h1>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="connectionStatus">Caricamento...</span>
            </div>
        </div>

        <div class="chart-area">
            <canvas id="chartCanvas"></canvas>
        </div>

        <div class="controls-panel">
            <!-- Upload DXF & Data -->
            <div class="control-group">
                <h3>📊 Dati</h3>
                <div class="file-upload-wrapper">
                    <input type="file" id="dxfFileInput" accept=".dxf" onchange="handleDXFUpload(event)">
                    <label for="dxfFileInput" class="file-upload-label">
                        📁 Carica File DXF
                    </label>
                </div>
                <div class="file-name-display" id="fileName">Nessun file selezionato</div>
                <button class="control-btn full-width" onclick="loadCSVData()" style="margin-top: 12px;">
                    <span>🔄 Ricarica CSV</span>
                </button>
            </div>

            <!-- Offset Y -->
            <div class="control-group">
                <h3>↕️ Offset Verticale</h3>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Offset Y</span>
                        <span class="slider-value" id="offsetYValue">0</span>
                    </div>
                    <input type="number" id="offsetYInput" value="0" step="10"
                           oninput="setOffsetY(this.value)"
                           style="width: 100%; padding: 8px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: 'JetBrains Mono', monospace;">
                </div>
                <button class="control-btn full-width" onclick="resetOffset()" style="margin-top: 8px;">
                    <span>Reset Offset</span>
                </button>
            </div>

            <!-- Passo Interpolazione -->
            <div class="control-group">
                <h3>🔧 Passo Interpolazione</h3>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Precisione</span>
                        <span class="slider-value" id="interpolationValue">0.005</span>
                    </div>
                    <input type="number" id="interpolationInput" value="0.005" step="0.001" min="0.001" max="1"
                           oninput="setInterpolationStep(this.value)"
                           style="width: 100%; padding: 8px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: 'JetBrains Mono', monospace;">
                </div>
                <div style="font-size: 11px; color: var(--text-secondary); margin-top: 8px;">
                    Più basso = più punti (ricarica DXF dopo modifica)
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Punti Dati</span>
                <span class="info-value" id="dataPointsCount">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Offset Y</span>
                <span class="info-value" id="currentOffsetY">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Interpolazione</span>
                <span class="info-value" id="currentInterpolation">0.005</span>
            </div>
            <div class="info-item">
                <span class="info-label">Range X</span>
                <span class="info-value" id="rangeX">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Range Y</span>
                <span class="info-value" id="rangeY">-</span>
            </div>
        </div>
    </div>

    <script>
        let chartState = {
            data: [],
            offsetY: 0
        };

        let INTERPOLATION_STEP = 0.005;
        const SCALE_FACTOR = 1000.0;

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            drawChart();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ===== CARICA CSV =====
        function loadCSVData() {
            console.log("Caricamento CSV...");
            document.getElementById('connectionStatus').textContent = 'Caricamento CSV...';

            // Percorso relativo al CSV nella cartella data
            fetch('../data/output.csv?' + new Date().getTime())  // Cache busting
                .then(response => {
                    if (!response.ok) {
                        throw new Error('File CSV non trovato');
                    }
                    return response.text();
                })
                .then(csvText => {
                    parseCSV(csvText);
                })
                .catch(error => {
                    console.error('Errore caricamento CSV:', error);
                    document.getElementById('connectionStatus').textContent = 'ERRORE: ' + error.message;
                    chartState.data = [];
                    updateUI();
                    drawChart();
                });
        }

        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            chartState.data = [];

            // Salta l'header (prima riga)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '') continue;

                const parts = line.split(',');
                if (parts.length >= 2) {
                    const x = parseFloat(parts[0]);
                    const y = parseFloat(parts[1]);

                    if (!isNaN(x) && !isNaN(y)) {
                        chartState.data.push({ x: x, y: y });
                    }
                }
            }

            console.log('CSV parsato: ' + chartState.data.length + ' punti');
            document.getElementById('connectionStatus').textContent = 'CSV caricato (' + chartState.data.length + ' punti)';

            updateUI();
            drawChart();
        }

        // ===== CONTROLLI =====
        function setOffsetY(value) {
            chartState.offsetY = parseFloat(value) || 0;
            updateUI();
            drawChart();
        }

        function resetOffset() {
            chartState.offsetY = 0;
            document.getElementById('offsetYInput').value = 0;
            updateUI();
            drawChart();
        }

        function setInterpolationStep(value) {
            INTERPOLATION_STEP = parseFloat(value) || 0.005;
            updateUI();
        }

        function updateUI() {
            document.getElementById('dataPointsCount').textContent = chartState.data.length;
            document.getElementById('offsetYValue').textContent = chartState.offsetY.toFixed(0);
            document.getElementById('currentOffsetY').textContent = chartState.offsetY.toFixed(0);
            document.getElementById('interpolationValue').textContent = INTERPOLATION_STEP.toFixed(3);
            document.getElementById('currentInterpolation').textContent = INTERPOLATION_STEP.toFixed(3);

            // Calcola range se ci sono dati
            if (chartState.data.length > 0) {
                const xValues = chartState.data.map(p => p.x);
                const yValues = chartState.data.map(p => p.y);
                const minX = Math.min(...xValues);
                const maxX = Math.max(...xValues);
                const minY = Math.min(...yValues);
                const maxY = Math.max(...yValues);
                document.getElementById('rangeX').textContent = minX.toFixed(1) + ' ~ ' + maxX.toFixed(1);
                document.getElementById('rangeY').textContent = minY.toFixed(1) + ' ~ ' + maxY.toFixed(1);
            } else {
                document.getElementById('rangeX').textContent = '-';
                document.getElementById('rangeY').textContent = '-';
            }
        }

        function drawChart() {
            console.log('drawChart() chiamato. Punti disponibili:', chartState.data.length);

            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const padding = 60;

            ctx.clearRect(0, 0, width, height);

            if (chartState.data.length === 0) {
                ctx.fillStyle = '#8a94a8';
                ctx.font = '16px Barlow';
                ctx.textAlign = 'center';
                ctx.fillText('Nessun dato disponibile.', width / 2, height / 2 - 10);
                ctx.fillText('Carica un file DXF o CSV', width / 2, height / 2 + 15);
                return;
            }

            // Applica offset Y ai dati
            const dataWithOffset = chartState.data.map(p => ({
                x: p.x,
                y: p.y + chartState.offsetY
            }));

            let minX = Math.min(...dataWithOffset.map(p => p.x));
            let maxX = Math.max(...dataWithOffset.map(p => p.x));
            let minY = Math.min(...dataWithOffset.map(p => p.y));
            let maxY = Math.max(...dataWithOffset.map(p => p.y));

            // AutoScale con margine 10%
            const rangeX = maxX - minX;
            minX -= rangeX * 0.1;
            maxX += rangeX * 0.1;

            const rangeY = maxY - minY;
            minY -= rangeY * 0.1;
            maxY += rangeY * 0.1;

            // Grid
            ctx.strokeStyle = '#2a3447';
            ctx.lineWidth = 1;

            for (let i = 0; i <= 10; i++) {
                const x = padding + (width - 2 * padding) * (i / 10);
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, height - padding);
                ctx.stroke();

                const y = padding + (height - 2 * padding) * (i / 10);
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#8a94a8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, height - padding);
            ctx.lineTo(width - padding, height - padding);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#8a94a8';
            ctx.font = '12px JetBrains Mono';
            ctx.textAlign = 'center';

            for (let i = 0; i <= 5; i++) {
                const x = padding + (width - 2 * padding) * (i / 5);
                const value = minX + (maxX - minX) * (i / 5);
                ctx.fillText(value.toFixed(1), x, height - padding + 20);
            }

            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const y = height - padding - (height - 2 * padding) * (i / 5);
                const value = minY + (maxY - minY) * (i / 5);
                ctx.fillText(value.toFixed(1), padding - 10, y + 4);
            }

            const transformX = (x) => padding + (width - 2 * padding) * ((x - minX) / (maxX - minX));
            const transformY = (y) => height - padding - (height - 2 * padding) * ((y - minY) / (maxY - minY));

            // Line
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            dataWithOffset.forEach((point, index) => {
                const x = transformX(point.x);
                const y = transformY(point.y);
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Points
            dataWithOffset.forEach(point => {
                const x = transformX(point.x);
                const y = transformY(point.y);

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 8);
                gradient.addColorStop(0, 'rgba(0, 255, 170, 0.4)');
                gradient.addColorStop(1, 'rgba(0, 255, 170, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#00ffaa';
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Axis titles
            ctx.fillStyle = '#e8edf4';
            ctx.font = '14px Barlow';
            ctx.textAlign = 'center';
            ctx.fillText('Asse X', width / 2, height - 10);

            ctx.save();
            ctx.translate(20, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Asse Y', 0, 0);
            ctx.restore();
        }

        // ===== DXF PARSING =====

        function handleDXFUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = file.name;
            document.getElementById('connectionStatus').textContent = 'Caricamento DXF...';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dxfString = e.target.result;
                    parseDXF(dxfString, file.name);
                } catch (error) {
                    console.error('Errore lettura file:', error);
                    document.getElementById('connectionStatus').textContent = 'ERRORE: ' + error.message;
                }
            };
            reader.readAsText(file);
        }

        // ===== PARSER DXF NATIVO =====
        function parseDXFNative(dxfString) {
            const lines = dxfString.split('\n').map(l => l.trim());
            const entities = [];
            let currentEntity = null;
            let inEntitiesSection = false;
            let groupCode = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Rileva sezione ENTITIES
                if (line === 'ENTITIES') {
                    inEntitiesSection = true;
                    continue;
                }
                if (line === 'ENDSEC' && inEntitiesSection) {
                    if (currentEntity) entities.push(currentEntity);
                    break;
                }

                if (!inEntitiesSection) continue;

                // Group code (numero)
                if (i % 2 === 0) {
                    groupCode = parseInt(line);
                } else {
                    // Value
                    const value = line;

                    if (groupCode === 0) {
                        // Nuovo entity
                        if (currentEntity) entities.push(currentEntity);
                        currentEntity = { type: value, data: {} };
                    } else if (currentEntity) {
                        // Store data by group code
                        if (!currentEntity.data[groupCode]) {
                            currentEntity.data[groupCode] = [];
                        }
                        currentEntity.data[groupCode].push(value);
                    }
                }
            }

            console.log('Parser nativo: trovate', entities.length, 'entità');
            return { entities: entities };
        }

        function parseDXF(dxfString, fileName) {
            try {
                console.log('=== PARSING DXF (Parser Nativo) ===');
                console.log('File:', fileName);
                console.log('Dimensione file:', dxfString.length, 'caratteri');
                console.log('Passo interpolazione:', INTERPOLATION_STEP);
                console.log('Fattore scala:', SCALE_FACTOR);

                const dxf = parseDXFNative(dxfString);

                console.log('DXF parsato');
                console.log('Entità trovate:', dxf.entities ? dxf.entities.length : 0);

                if (!dxf || !dxf.entities || dxf.entities.length === 0) {
                    throw new Error('DXF non valido o vuoto');
                }

                // Log dei tipi di entità presenti
                const entityTypes = {};
                dxf.entities.forEach(entity => {
                    entityTypes[entity.type] = (entityTypes[entity.type] || 0) + 1;
                });
                console.log('Tipi di entità nel DXF:', entityTypes);

                let xPoints = [];
                let yPoints = [];
                let splineCount = 0;
                let lineCount = 0;
                let arcCount = 0;
                let polylineCount = 0;
                let ignoredCount = 0;

                // Processa tutte le entità
                dxf.entities.forEach(entity => {
                    console.log('Processando entità tipo:', entity.type);

                    if (entity.type === 'SPLINE') {
                        splineCount++;
                        console.log('Processando Spline #' + splineCount, entity);
                        processSplineNative(entity, xPoints, yPoints);
                    } else if (entity.type === 'LINE') {
                        lineCount++;
                        console.log('Processando Line #' + lineCount, entity);
                        processLineNative(entity, xPoints, yPoints);
                    } else if (entity.type === 'ARC') {
                        arcCount++;
                        console.log('Processando Arc #' + arcCount, entity);
                        processArcNative(entity, xPoints, yPoints);
                    } else if (entity.type === 'LWPOLYLINE' || entity.type === 'POLYLINE') {
                        polylineCount++;
                        console.log('Processando Polyline #' + polylineCount, entity);
                        processPolylineNative(entity, xPoints, yPoints);
                    } else {
                        ignoredCount++;
                        console.log('Entità ignorata:', entity.type);
                    }
                });

                console.log('Punti totali generati (prima della scala):', xPoints.length);
                console.log('Splines:', splineCount, 'Lines:', lineCount, 'Arcs:', arcCount, 'Polylines:', polylineCount, 'Ignorati:', ignoredCount);

                if (xPoints.length === 0) {
                    const errorMsg = `DXF processato ma nessun punto estratto. Entità trovate: ${dxf.entities.length}. Controllare console per dettagli.`;
                    document.getElementById('connectionStatus').textContent = errorMsg;
                    throw new Error(errorMsg);
                }

                // Applica fattore di scala
                for (let i = 0; i < xPoints.length; i++) {
                    xPoints[i] *= SCALE_FACTOR;
                    yPoints[i] *= SCALE_FACTOR;
                }

                console.log('Scala applicata. Range prima della conversione in chartState.data');
                console.log('X:', Math.min(...xPoints).toFixed(2), 'to', Math.max(...xPoints).toFixed(2));
                console.log('Y:', Math.min(...yPoints).toFixed(2), 'to', Math.max(...yPoints).toFixed(2));

                // Converti in formato chartState.data
                chartState.data = [];
                for (let i = 0; i < xPoints.length; i++) {
                    chartState.data.push({ x: xPoints[i], y: yPoints[i] });
                }

                console.log('chartState.data popolato con', chartState.data.length, 'punti');
                console.log('Primi 3 punti:', chartState.data.slice(0, 3));

                // Calcola statistiche
                const minX = Math.min(...xPoints);
                const maxX = Math.max(...xPoints);
                const minY = Math.min(...yPoints);
                const maxY = Math.max(...yPoints);

                let successMsg = `Caricati ${xPoints.length} punti`;
                const parts = [];
                if (splineCount > 0) parts.push(`${splineCount} splines`);
                if (lineCount > 0) parts.push(`${lineCount} linee`);
                if (arcCount > 0) parts.push(`${arcCount} archi`);
                if (polylineCount > 0) parts.push(`${polylineCount} polylines`);
                if (parts.length > 0) successMsg += ` (${parts.join(', ')})`;

                document.getElementById('connectionStatus').textContent = successMsg;

                console.log('=== DXF CARICATO CON SUCCESSO ===');
                console.log(successMsg);
                console.log('Range X:', minX.toFixed(1), 'to', maxX.toFixed(1));
                console.log('Range Y:', minY.toFixed(1), 'to', maxY.toFixed(1));

                // Esporta CSV (opzionale)
                exportToCSV(chartState.data);

                updateUI();
                drawChart();

            } catch (error) {
                console.error('Errore parsing DXF:', error);
                document.getElementById('connectionStatus').textContent = 'ERRORE: ' + error.message;
                chartState.data = [];
                updateUI();
                drawChart();
            }
        }

        // ===== FUNZIONI DI PROCESSAMENTO PER PARSER NATIVO =====
        function processLineNative(entity, xPoints, yPoints) {
            // LINE: group codes 10,20 (start), 11,21 (end)
            const x1 = entity.data[10] ? parseFloat(entity.data[10][0]) : 0;
            const y1 = entity.data[20] ? parseFloat(entity.data[20][0]) : 0;
            const x2 = entity.data[11] ? parseFloat(entity.data[11][0]) : 0;
            const y2 = entity.data[21] ? parseFloat(entity.data[21][0]) : 0;

            console.log('  LINE da (' + x1 + ',' + y1 + ') a (' + x2 + ',' + y2 + ')');
            interpolateLine(x1, y1, x2, y2, xPoints, yPoints);
        }

        function processArcNative(entity, xPoints, yPoints) {
            // ARC: 10,20 (center), 40 (radius), 50 (start angle), 51 (end angle)
            const cx = entity.data[10] ? parseFloat(entity.data[10][0]) : 0;
            const cy = entity.data[20] ? parseFloat(entity.data[20][0]) : 0;
            const radius = entity.data[40] ? parseFloat(entity.data[40][0]) : 0;
            const startAngle = entity.data[50] ? parseFloat(entity.data[50][0]) : 0;
            const endAngle = entity.data[51] ? parseFloat(entity.data[51][0]) : 360;

            console.log('  ARC centro (' + cx + ',' + cy + ') raggio ' + radius + ' angoli ' + startAngle + '-' + endAngle);

            const arc = {
                center: { x: cx, y: cy },
                radius: radius,
                startAngle: startAngle,
                endAngle: endAngle
            };
            interpolateArc(arc, xPoints, yPoints);
        }

        function processPolylineNative(entity, xPoints, yPoints) {
            // LWPOLYLINE/POLYLINE: group codes 10,20 per ogni vertice
            const xs = entity.data[10] || [];
            const ys = entity.data[20] || [];
            const closed = entity.data[70] && parseInt(entity.data[70][0]) & 1;

            console.log('  POLYLINE con ' + xs.length + ' vertici, closed=' + closed);

            for (let i = 0; i < xs.length - 1; i++) {
                const x1 = parseFloat(xs[i]);
                const y1 = parseFloat(ys[i]);
                const x2 = parseFloat(xs[i + 1]);
                const y2 = parseFloat(ys[i + 1]);
                interpolateLine(x1, y1, x2, y2, xPoints, yPoints);
            }

            // Se chiusa, collega ultimo a primo
            if (closed && xs.length > 1) {
                const x1 = parseFloat(xs[xs.length - 1]);
                const y1 = parseFloat(ys[ys.length - 1]);
                const x2 = parseFloat(xs[0]);
                const y2 = parseFloat(ys[0]);
                interpolateLine(x1, y1, x2, y2, xPoints, yPoints);
            }
        }

        function processSplineNative(entity, xPoints, yPoints) {
            // SPLINE: control points in 10,20,30
            // Fit points in 11,21,31
            const controlX = entity.data[10] || [];
            const controlY = entity.data[20] || [];
            const fitX = entity.data[11] || [];
            const fitY = entity.data[21] || [];
            const closed = entity.data[70] && parseInt(entity.data[70][0]) & 1;

            // Usa fit points se disponibili, altrimenti control points
            const xs = fitX.length > 0 ? fitX : controlX;
            const ys = fitY.length > 0 ? fitY : controlY;

            console.log('  SPLINE con ' + xs.length + ' punti, closed=' + closed);

            if (xs.length < 2) {
                console.warn('  SPLINE senza punti sufficienti');
                return;
            }

            const startLength = xPoints.length;

            for (let i = 0; i < xs.length - 1; i++) {
                const x1 = parseFloat(xs[i]);
                const y1 = parseFloat(ys[i]);
                const x2 = parseFloat(xs[i + 1]);
                const y2 = parseFloat(ys[i + 1]);
                interpolateLine(x1, y1, x2, y2, xPoints, yPoints);
            }

            // Se chiusa, collega ultimo a primo
            if (closed && xs.length > 1) {
                const x1 = parseFloat(xs[xs.length - 1]);
                const y1 = parseFloat(ys[ys.length - 1]);
                const x2 = parseFloat(xs[0]);
                const y2 = parseFloat(ys[0]);
                interpolateLine(x1, y1, x2, y2, xPoints, yPoints);
            }

            const addedPoints = xPoints.length - startLength;
            console.log('  SPLINE processata. Punti aggiunti:', addedPoints);
        }

        // ===== FUNZIONI LEGACY (NON PIÙ USATE) =====
        function processSpline(spline, xPoints, yPoints) {
            console.log('processSpline chiamato con:', spline);
            console.log('  controlPoints:', spline.controlPoints ? spline.controlPoints.length : 'N/A');
            console.log('  fitPoints:', spline.fitPoints ? spline.fitPoints.length : 'N/A');
            console.log('  closed:', spline.closed);

            // Le spline nel DXF parser hanno controlPoints
            if (!spline.controlPoints || spline.controlPoints.length < 2) {
                // Prova anche fitPoints
                if (!spline.fitPoints || spline.fitPoints.length < 2) {
                    console.warn('Spline senza control points o fit points sufficienti:', spline);
                    return;
                }
            }

            // Genera punti poligonali dalla spline
            // Interpolazione semplificata: crea segmenti tra i control points
            const points = spline.controlPoints || [];

            // Se la spline ha fitPoints, usali invece
            const interpolatePoints = spline.fitPoints && spline.fitPoints.length > 0
                ? spline.fitPoints
                : points;

            console.log('  Usando', interpolatePoints.length, 'punti per interpolazione');
            console.log('  Primi 2 punti:', interpolatePoints.slice(0, 2));

            const startLength = xPoints.length;

            // Interpola tra i punti
            for (let i = 0; i < interpolatePoints.length - 1; i++) {
                const p1 = interpolatePoints[i];
                const p2 = interpolatePoints[i + 1];
                interpolateLine(p1.x, p1.y, p2.x, p2.y, xPoints, yPoints);
            }

            // Se chiusa, collega ultimo a primo
            if (spline.closed && interpolatePoints.length > 1) {
                const p1 = interpolatePoints[interpolatePoints.length - 1];
                const p2 = interpolatePoints[0];
                interpolateLine(p1.x, p1.y, p2.x, p2.y, xPoints, yPoints);
            }

            const addedPoints = xPoints.length - startLength;
            console.log('  Spline processata. Punti aggiunti:', addedPoints);
        }

        function interpolateLine(x1, y1, x2, y2, xPoints, yPoints) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);

            if (length < 0.0001) return;

            const numSegments = Math.max(1, Math.floor(length / INTERPOLATION_STEP));

            for (let i = 0; i <= numSegments; i++) {
                const t = i / numSegments;
                xPoints.push(x1 + dx * t);
                yPoints.push(y1 + dy * t);
            }
        }

        function interpolateArc(arc, xPoints, yPoints) {
            let startAngle = arc.startAngle || 0;
            let endAngle = arc.endAngle || 360;

            // Normalizza angoli
            while (endAngle < startAngle) endAngle += 360;

            const angleRange = endAngle - startAngle;
            const arcLength = arc.radius * (angleRange * Math.PI / 180.0);
            const numSegments = Math.max(2, Math.floor(arcLength / INTERPOLATION_STEP));

            for (let i = 0; i <= numSegments; i++) {
                const t = i / numSegments;
                const angle = startAngle + angleRange * t;
                const angleRad = angle * Math.PI / 180.0;

                const x = arc.center.x + arc.radius * Math.cos(angleRad);
                const y = arc.center.y + arc.radius * Math.sin(angleRad);

                xPoints.push(x);
                yPoints.push(y);
            }
        }

        function exportToCSV(data) {
            try {
                let csv = 'X,Y\n';
                data.forEach(point => {
                    csv += point.x.toFixed(6) + ',' + point.y.toFixed(6) + '\n';
                });

                // Crea blob e download
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dxf_output.csv';
                // Non fare auto-download, solo log
                console.log('CSV generato (' + data.length + ' punti). Usa il link per scaricare.');

                // Puoi decommentare per auto-download:
                // a.click();
                // window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Errore export CSV:', error);
            }
        }

        // Carica automaticamente all'avvio
        window.addEventListener('load', function() {
            console.log('Widget caricato - Pronto per upload DXF o caricamento CSV');
            // Commenta l'auto-load CSV se vuoi solo upload DXF
            // loadCSVData();

            // Commenta l'auto-refresh se vuoi solo upload manuale
            // setInterval(loadCSVData, 2000);
        });
    </script>
